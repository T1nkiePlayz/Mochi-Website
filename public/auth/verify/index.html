<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify your Mochi account</title>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <script>
    (function () {
      var query = window.location.search;
      var params = new URLSearchParams(query);
      var tokenHash = params.get('token_hash');
      var type = params.get('type');
      var target = params.get('target');

      // Remove verification material from the visible browser history immediately.
      window.history.replaceState(null, '', window.location.pathname);

      if (!tokenHash || type !== 'email') {
        window.location.replace('../../#/auth/verify');
        return;
      }

      var encodedQuery =
        '?token_hash=' + encodeURIComponent(tokenHash) +
        '&type=' + encodeURIComponent(type);

      if (target === 'desktop') {
        window.location.replace('mochi://auth/verify' + encodedQuery);
        return;
      }

      window.location.replace('../../#/auth/verify' + encodedQuery);
    })();
  </script>
</head>
<body>
  <p>Opening Mochi verification…</p>
</body>
</html>
